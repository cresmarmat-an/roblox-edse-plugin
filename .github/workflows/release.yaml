name: Release

# Pushing a v* tag builds EDSE.rbxm and publishes it as a GitHub release.
#
#   git tag v1.0.0
#   git push origin v1.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (version $VERSION)"

      - name: Install Rojo
        run: |
          ROJO_VERSION="$(sed -n 's|^rojo *= *"rojo-rbx/rojo@\(.*\)"|\1|p' rokit.toml | head -1)"
          echo "Installing Rojo $ROJO_VERSION"
          curl -fsSL -o rojo.zip \
            "https://github.com/rojo-rbx/rojo/releases/download/v${ROJO_VERSION}/rojo-${ROJO_VERSION}-linux-x86_64.zip"
          unzip -q rojo.zip -d "$HOME/.bin"
          chmod +x "$HOME/.bin/rojo"
          echo "$HOME/.bin" >> "$GITHUB_PATH"

      - name: Build EDSE.rbxm
        run: |
          rojo build default.project.json -o EDSE.rbxm
          ls -l EDSE.rbxm

      - name: Assemble release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Use the matching CHANGELOG.md section if there is one; otherwise fall
          # back to GitHub's generated notes so a tag push always produces a release.
          awk -v version="$VERSION" '
            $0 ~ "^## +" version "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ -s RELEASE_NOTES.md ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "No '## $VERSION' section in CHANGELOG.md; using generated notes."
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

          {
            echo
            echo "## Install"
            echo
            echo 'Download `EDSE.rbxm` below and drag it into your plugins folder.'
          } >> RELEASE_NOTES.md

          cat RELEASE_NOTES.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"

          EXTRA=""
          if [ "${{ steps.notes.outputs.generate }}" = "true" ]; then
            EXTRA="--generate-notes"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating it."
            gh release edit "$TAG" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG" EDSE.rbxm --clobber
          else
            gh release create "$TAG" EDSE.rbxm \
              --title "$TAG" \
              --notes-file RELEASE_NOTES.md \
              --verify-tag \
              $EXTRA
          fi